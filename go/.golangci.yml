version: "2"

run:
  timeout: 5m
  go: '1.25'
  relative-path-mode: gomod
  # Exit code when at least one issue was found.
  # Default: 1
  issues-exit-code: 1
  # Include test files or not.
  # Default: true
  tests: false

  concurrency: 4

linters:
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errcheck
    - goconst
    - gocyclo
    - gocognit
    - misspell
    - gosec
    - nilerr
    - errorlint
    - bodyclose
    - prealloc
    - makezero
    - unconvert
    - unparam
    - exhaustive
    - nestif
    - reassign
    - whitespace
    - forcetypeassert
    - lll
    - funlen

  settings:
    gocyclo:
      min-complexity: 10
    lll:
      line-length: 120

formatters:
  enable:
    - gci
    - gofmt
    - goimports
    - golines

issues:
  # Maximum issues count per one linter.
  # Set to 0 to disable.
  # Default: 50
  max-issues-per-linter: 20
  # Maximum count of issues with the same text.
  # Set to 0 to disable.
  # Default: 3
  max-same-issues: 3
  uniq-by-line: true
  fix: false
